# 阶段1：在（公开数据集为主的）合并数据集上，基于 COCO 预训练权重做第一轮迁移训练
# 目标：让模型先学会"包裹"这个大类的通用特征

model: yolov8n.pt          # 官方 COCO 预训练权重，会自动下载；显存充裕可换 yolov8s.pt
data: data/dataset/data.yaml
epochs: 80
imgsz: 640
batch: 16
patience: 20
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
mosaic: 1.0
mixup: 0.1
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
fliplr: 0.5
project: training/runs
name: stage1
